name: Deploy Plugin
on:
  push:
    branches: [main, production]
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.HOSTINGER_SSH_KEY }}
            ${{ secrets.VPS_SSH_KEY }}
      - name: Add hosts to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Ensure remote plugin directory (staging)
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} "mkdir -p ${{ secrets.HOSTINGER_PATH_STAGING }}"
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/main'
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' \
            --exclude 'node_modules' --exclude 'vendor' \
            --exclude '*.zip' --exclude '*.log' --exclude '*.bak' \
            --exclude 'README.md' \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }}" \
            ./ ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH_STAGING }}/
      - name: Ensure remote plugin directory (production)   # VPS-PROD
        if: github.ref == 'refs/heads/production'
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p '${{ secrets.VPS_PATH_PRODUCTION }}'"
      - name: Deploy to Production   # VPS-PROD
        if: github.ref == 'refs/heads/production'
        run: |
          rsync -avz --delete --protect-args \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' \
            --exclude 'node_modules' --exclude 'vendor' \
            --exclude '*.zip' --exclude '*.log' --exclude '*.bak' \
            --exclude 'README.md' \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:"${{ secrets.VPS_PATH_PRODUCTION }}/"
      - name: Purge caches (production - VPS)   # VPS-PROD
        if: github.ref == 'refs/heads/production'
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "/srv/wp-hingenia/purge.sh" || true

      - name: Deploy summary
        run: echo "::notice::Deploy completo para ref=${{ github.ref }}"
